<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');
    </style>
  </defs>
  <g id="monochrome-white-lockup">
    <g transform="translate(144, 20)">
      
    <defs>
      <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4B77FF" />
        <stop offset="100%" stop-color="#1B42D6" />
      </linearGradient>
      <linearGradient id="cyanCobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00E5FF" />
        <stop offset="100%" stop-color="#2D5BFF" />
      </linearGradient>
      <linearGradient id="cyanWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00E5FF" />
        <stop offset="100%" stop-color="#FFFFFF" />
      </linearGradient>
      <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.6"/>
      </filter>
    </defs>
    
    <!-- Mark Group (512x512 viewport) -->
    <g id="mark-symbol">
      <!-- 1. The Anchor Pillar (Left vertical stem of 'R' - Financial Stability) -->
      <rect x="124" y="104" width="52" height="304" rx="26" fill="#FFFFFF" />

      <!-- 2. The SplitVault Netting Loop (Upper bowl of 'R' - Automated Flow) -->
      <path d="M 150 130 H 280 C 335 130 376 168 376 218 C 376 268 335 306 280 306 H 150" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="52" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- 3. The Ascending Momentum Leg (Diagonal forward strut of 'R' - Sovereign Control & Debt Settlement) -->
      <path d="M 265 285 L 358 396" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="52" 
            stroke-linecap="round" />

      <!-- 4. The Netting Clarity Spark (Inspired by UI Asterisk / Pairwise Zero-Debt Convergence) -->
      <g id="clarity-spark" transform="translate(262, 218)" filter="url(#sparkGlow)">
        <!-- 4-point Diamond Compass Spark -->
        <path d="M 0 -36 C 0 -12 12 0 36 0 C 12 0 0 12 0 36 C 0 12 -12 0 -36 0 C -12 0 0 -12 0 -36 Z" 
              fill="#FFFFFF" />
        <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
      </g>
    </g>
  
    </g>
    <g id="typography">
      <text x="400" y="550" text-anchor="middle" fill="#FFFFFF" font-size="64" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" letter-spacing="-0.02em">Raqmify</text>
      <text x="400" y="610" text-anchor="middle" fill="#FFFFFF" font-size="19" font-family="'Inter', -apple-system, sans-serif" font-weight="600" letter-spacing="0.28em">YOUR MONEY, YOUR CONTROL</text>
      <line x1="310" y1="640" x2="490" y2="640" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>